name: CI - pytest

# 每次 push 到 main / 開 PR 都自動跑全部測試
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 也可在 GitHub 網頁手動觸發

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx   # httpx 給 fastapi TestClient 用

      - name: 跑全部測試（123 個）
        run: python -m pytest tests/ -v --tb=short

      - name: 測試結果摘要
        if: always()
        run: echo "測試完成 — 綠燈代表所有功能正常，紅燈代表有改壞東西"
