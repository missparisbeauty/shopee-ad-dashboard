name: Deploy - Cloud Run

# push 到 main → 先跑測試 → 通過才自動部署到 Cloud Run
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGION: asia-east1
  SERVICE: shopee-dashboard
  BUCKET: shopee-dashboard-data-1391087402

jobs:
  # 先確保測試綠燈才部署（CI 那個 workflow 也會跑，這裡再保險一次）
  test-then-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: 跑測試（沒過就不部署）
        run: python -m pytest tests/ -q --tb=short

      - name: 認證 GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 設定 gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Build image（Cloud Build）
        run: |
          gcloud builds submit \
            --project=${{ secrets.GCP_PROJECT }} \
            --tag=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/cloud-run-source-deploy/${{ env.SERVICE }} \
            --default-buckets-behavior=regional-user-owned-bucket \
            .

      - name: 部署 Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project=${{ secrets.GCP_PROJECT }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/cloud-run-source-deploy/${{ env.SERVICE }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi --cpu=1 \
            --min-instances=1 --max-instances=1 \
            --timeout=300 --concurrency=10 \
            --set-env-vars="DATA_DIR=/data,BASIC_AUTH_USER=admin" \
            --set-secrets="BASIC_AUTH_PASS=shopee-dashboard-auth-pass:latest" \
            --add-volume="name=data-volume,type=cloud-storage,bucket=${{ env.BUCKET }}" \
            --add-volume-mount="volume=data-volume,mount-path=/data" \
            --execution-environment=gen2

      - name: 顯示部署結果
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --project=${{ secrets.GCP_PROJECT }} --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ 已部署：$URL"
