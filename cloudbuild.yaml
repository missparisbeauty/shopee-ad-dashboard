steps:
  # 1. Build container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE:$SHORT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE:latest'
      - '.'

  # 2. Push
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE']

  # 3. Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE'
      - '--region=$_REGION'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE:latest'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--timeout=300'
      - '--concurrency=10'
      - '--execution-environment=gen2'
      - '--set-env-vars=DATA_DIR=/data'
      - '--add-volume=name=data-volume,type=cloud-storage,bucket=$_BUCKET'
      - '--add-volume-mount=volume=data-volume,mount-path=/data'

substitutions:
  _SERVICE: shopee-dashboard
  _REGION: asia-east1
  _BUCKET: ${PROJECT_ID}-data

options:
  logging: CLOUD_LOGGING_ONLY
